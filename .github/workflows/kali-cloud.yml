name: 🛡️ CYNET Cloud Kali Linux

on:
  workflow_dispatch: # اجرای دستی با ۱ کلیک

jobs:
  launch-kali:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # حداکثر ۶ ساعت اجرای مداوم

    steps:
      - name: 🚀 Optimize System & Install Cloudflared
        run: |
          echo "=========================================================="
          echo "  🛡️ CYNET CLOUD KALI LINUX - STARTING..."
          echo "=========================================================="
          sudo apt-get update -y -q
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

      - name: 📦 Pull & Launch Official Kali Linux Desktop Container
        run: |
          echo "⚡ Launching KasmWeb Kali Rolling Desktop with Full GUI..."
          docker run -d \
            --name cynet-kali \
            --privileged \
            --shm-size=2g \
            -p 6901:6901 \
            -e VNC_PW=cynet123 \
            kasmweb/kali-rolling-desktop:1.16.0

          echo "⏳ Waiting for Kali Desktop to initialize..."
          sleep 15

      - name: 🌐 Expose Kali GUI to Web Browser
        run: |
          echo "=========================================================="
          echo "  🎉 CONNECTING CLOUD KALI LINUX TO WEB BROWSER..."
          echo "=========================================================="
          
          # اتصال امن کلودفلر به پورت HTTPS کالی
          cloudflared tunnel --url https://localhost:6901 --no-tls-verify > tunnel.log 2>&1 &
          
          sleep 5
          for i in {1..20}; do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -n 1)
            if [ -n "$URL" ]; then
              echo ""
              echo "=========================================================="
              echo "  🔥 YOUR KALI LINUX CLOUD DESKTOP IS LIVE & READY!"
              echo "  👉 CLICK TO OPEN: $URL"
              echo "  --------------------------------------------------------"
              echo "  🔑 Username: kasm_user"
              echo "  🔑 Password: cynet123"
              echo "=========================================================="
              echo ""
              break
            fi
            sleep 2
          done

          # نگه داشتن سرور به صورت زنده
          echo "🛡️ Kali Linux is running live... Keep this tab open."
          docker logs -f cynet-kali
